<svg width="1000" height="520" viewBox="0 0 1000 520"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Moving accent -->
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Card gradients -->
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>

    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#15121F"/>
    </linearGradient>

    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#111A1B"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="18" fill="url(#bg)"/>

  <!-- Header -->
  <text x="500" y="48"
        text-anchor="middle"
        fill="#F0F6FC"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="700">
    FEATURED PROJECTS
  </text>

  <text x="500" y="74"
        text-anchor="middle"
        fill="#8B949E"
        font-family="Arial, sans-serif"
        font-size="13">
    things I've built, experimented with, and learned from
  </text>

  <!-- Moving header line -->
  <rect x="350" y="91" width="300" height="2" rx="1"
        fill="url(#line)">
    <animate attributeName="x"
             values="250;450;250"
             dur="4s"
             repeatCount="indefinite"/>
  </rect>


  <!-- ================= PROJECT 1 ================= -->

  <rect x="35" y="120" width="295" height="340" rx="14"
        fill="url(#card1)"
        stroke="#30363D"
        stroke-width="1"/>

  <!-- Animated border accent -->
  <rect x="35" y="120" width="295" height="340" rx="14"
        fill="none"
        stroke="#58A6FF"
        stroke-width="1"
        stroke-dasharray="40 600"
        opacity="0.8">
    <animate attributeName="stroke-dashoffset"
             from="0" to="-640"
             dur="5s"
             repeatCount="indefinite"/>
  </rect>

  <circle cx="62" cy="149" r="5" fill="#3FB950" filter="url(#glow)">
    <animate attributeName="r"
             values="4;6;4"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>

  <text x="78" y="155"
        fill="#3FB950"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="700">
    LIVE
  </text>

  <text x="55" y="205"
        fill="#F0F6FC"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="700">
    ApexEngineer-AI
  </text>

  <text x="55" y="238"
        fill="#8B949E"
        font-family="Arial, sans-serif"
        font-size="13">
    AI • F1 Telemetry • Analytics
  </text>

  <line x1="55" y1="264" x2="310" y2="264"
        stroke="#30363D"/>

  <text x="55" y="292"
        fill="#C9D1D9"
        font-family="Arial, sans-serif"
        font-size="12">
    Formula 1 telemetry analysis
  </text>

  <text x="55" y="313"
        fill="#C9D1D9"
        font-family="Arial, sans-serif"
        font-size="12">
    with pit-wall style insights,
  </text>

  <text x="55" y="334"
        fill="#C9D1D9"
        font-family="Arial, sans-serif"
        font-size="12">
    driver comparison and AI analysis.
  </text>

  <text x="55" y="405"
        fill="#58A6FF"
        font-family="Arial, sans-serif"
        font-size="12"
        font-weight="700">
    VIEW PROJECT →
  </text>


  <!-- ================= PROJECT 2 ================= -->

  <rect x="352" y="120" width="295" height="340" rx="14"
        fill="url(#card2)"
        stroke="#30363D"
        stroke-width="1"/>

  <rect x="352" y="120" width="295" height="340" rx="14"
        fill="none"
        stroke="#A371F7"
        stroke-width="1"
        stroke-dasharray="40 600"
        opacity="0.8">
    <animate attributeName="stroke-dashoffset"
             from="0" to="-640"
             dur="5s"
             begin="1s"
             repeatCount="indefinite"/>
  </rect>

  <circle cx="379" cy="149" r="5" fill="#A371F7" filter="url(#glow)">
    <animate attributeName="r"
             values="4;6;4"
             dur="2s"
             begin="0.5s"
             repeatCount="indefinite"/>
  </circle>

  <text x="395" y="155"
        fill="#A371F7"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="700">
    BUILDATHON
  </text>

  <text x="372" y="205"
        fill="#F0F6FC"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="700">
    animus.ai
  </text>

  <text x="372" y="238"
        fill="#8B949E"
        font-family="Arial, sans-serif"
        font-size="13">
    AI • Fraud Detection • Risk
  </text>

  <line x1="372" y1="264" x2="627" y2="264"
        stroke="#30363D"/>

  <text x="372" y="292"
        fill="#C9D1D9"
        font-family="Arial, sans-serif"
        font-size="12">
    Behavioral fraud detection
  </text>

  <text x="372" y="313"
        fill="#C9D1D9"
        font-family="Arial, sans-serif"
        font-size="12">
    platform built during the
  </text>

  <text x="372" y="334"
        fill="#C9D1D9"
        font-family="Arial, sans-serif"
        font-size="12">
    Razorpay Buildathon.
  </text>

  <text x="372" y="405"
        fill="#A371F7"
        font-family="Arial, sans-serif"
        font-size="12"
        font-weight="700">
    VIEW PROJECT →
  </text>


  <!-- ================= PROJECT 3 ================= -->

  <rect x="670" y="120" width="295" height="340" rx="14"
        fill="url(#card3)"
        stroke="#30363D"
        stroke-width="1"/>

  <rect x="670" y="120" width="295" height="340" rx="14"
        fill="none"
        stroke="#39D353"
        stroke-width="1"
        stroke-dasharray="40 600"
        opacity="0.8">
    <animate attributeName="stroke-dashoffset"
             from="0" to="-640"
             dur="5s"
             begin="2s"
             repeatCount="indefinite"/>
  </rect>

  <circle cx="697" cy="149" r="5" fill="#39D353" filter="url(#glow)">
    <animate attributeName="r"
             values="4;6;4"
             dur="2s"
             begin="1s"
             repeatCount="indefinite"/>
  </circle>

  <text x="713" y="155"
        fill="#39D353"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="700">
    ACADEMIC PROJECT
  </text>

  <text x="690" y="198"
        fill="#F0F6FC"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="700">
    Semantic Dataset
  </text>

  <text x="690" y="222"
        fill="#F0F6FC"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="700">
    Recommendation
  </text>

  <text x="690" y="253"
        fill="#8B949E"
        font-family="Arial, sans-serif"
        font-size="13">
    LLMs • Embeddings • Search
  </text>

  <line x1="690" y1="279" x2="945" y2="279"
        stroke="#30363D"/>

  <text x="690" y="307"
        fill="#C9D1D9"
        font-family="Arial, sans-serif"
        font-size="12">
    Semantic dataset discovery
  </text>

  <text x="690" y="328"
        fill="#C9D1D9"
        font-family="Arial, sans-serif"
        font-size="12">
    using embeddings, metadata
  </text>

  <text x="690" y="349"
        fill="#C9D1D9"
        font-family="Arial, sans-serif"
        font-size="12">
    and LLM-powered search.
  </text>

  <text x="690" y="405"
        fill="#39D353"
        font-family="Arial, sans-serif"
        font-size="12"
        font-weight="700">
    VIEW PROJECT →
  </text>

</svg>